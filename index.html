<html>
<head>

	<link rel="manifest" href="appmanifest.json" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />
	<meta name="HandheldFriendly" content="true" />
	<meta name="mobile-web-app-capable" content="yes" />
	<link rel="shortcut icon" sizes="256x256" href="icon-256.png" />
	<style type="text/css">
		* {
			padding: 0;
			margin: 0;
		}
		html, body {
			background: #fff;
			background-image: url(fon.png);
			background-position: center;
            background-repeat: no-repeat;
			color: #fff;
			overflow: hidden;
			touch-action: none;
			-ms-touch-action: none;
		}
		canvas {
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}
        #loader {
	    display: block;
	    position: fixed;
	    z-index: 99999;
	    top: 0;
	    left: 0;
	    width: 100%;
	    height: 100%;
	    background-repeat: no-repeat;
	    background-position: center center;
	    background-color: #FFFFFF;
	    background-image: url(load.gif);
        }		
    </style>
	

</head> 
 
<body> 
	<div id="fb-root"></div>
    <div id="load"><div id="loader"></div></div>
    <script type="text/javascript">
	var preloader = document.getElementById("loader");
	function fadeOutnojquery(el) {
		el.style.opacity = 1;
		var interpreloader = setInterval(function () {
			el.style.opacity = el.style.opacity - 0.05;
			if (el.style.opacity <= 0.05) {
				clearInterval(interpreloader);
				preloader.style.display = "none";
			}
		}, 16);
	}

	window.onload = function () {
		setTimeout(function () {
			fadeOutnojquery(preloader);
		}, 1000);
	};
</script>

	<script>
	(function(){
		if (window.location.protocol.substr(0, 4) === "file")
		{
			alert("What are you looking for here?");
		}
	})();
	</script>
	<div id="c2canvasdiv">
		<canvas id="c2canvas" width="1000" height="600">
			<h1>The browser is not supported. Try installing a newer version of the browser
			<br/><br/><a href="https://www.microsoft.com/ru-ru/edge">Microsoft Edge</a><br/>
			<a href="http://www.google.com/chrome/">Google Chrome</a><br/>
			<a href="http://www.apple.com/safari/download/">Apple Safari</a></h1>
		</canvas>
		
	</div>
	<script src="jquery-3.4.1.min.js"></script>


	<script src="c2runtime.js"></script>
    <script>
		jQuery(document).ready(function ()
		{			
			cr_createRuntime("c2canvas");
		});
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>
</body> 
</html>
